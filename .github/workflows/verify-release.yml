name: Verify public release installation
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version (vX.Y.Z)
        required: true
        type: string
permissions:
  contents: read
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}
    steps:
      - name: Validate version
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          mkdir "$RUNNER_TEMP/anonymous-docker"
          echo "DOCKER_CONFIG=$RUNNER_TEMP/anonymous-docker" >> "$GITHUB_ENV"
      - name: Pull both architectures without registry credentials
        run: |
          docker pull --platform linux/amd64 "ghcr.io/impleotv/license-center:$RELEASE_TAG"
          docker pull --platform linux/arm64 "ghcr.io/impleotv/license-center:$RELEASE_TAG"
      - name: Download public package and verify checksum
        run: |
          base="https://github.com/impleotv/license-center-release/releases/download/$RELEASE_TAG"
          curl --fail --location --retry 3 "$base/license-center_${VERSION}_all.deb" -o "license-center_${VERSION}_all.deb"
          curl --fail --location --retry 3 "$base/SHA256SUMS.txt" -o SHA256SUMS.txt
          sha256sum --check --ignore-missing SHA256SUMS.txt
      - name: Install and configure Debian package
        run: |
          sudo apt-get install -y "./license-center_${VERSION}_all.deb"
          sudo env DOCKER_CONFIG="$DOCKER_CONFIG" license-centerctl configure --public-url https://licenses.example.test --proxy-port 6000 --non-interactive
          sudo license-centerctl status
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:6000/healthz && curl --fail --silent http://127.0.0.1:6000/readyz; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      - name: Collect failure diagnostics
        if: failure()
        run: |
          sudo systemctl status license-center.service --no-pager || true
          sudo journalctl -u license-center.service --no-pager -n 80 || true
          docker ps -a
      - name: Verify package removal preserves data
        run: |
          sudo apt-get remove -y license-center
          sudo test -s /etc/license-center/master.key
          sudo docker volume inspect license-center_license-center-data >/dev/null
